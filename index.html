    <script>
      (function() {
        var isViteWsError = function(e) {
          var msg = (e && (e.message || (e.reason && (e.reason.message || e.reason)))) || '';
          var file = (e && e.filename) || '';
          var stack = (e && e.error && e.error.stack) || '';
          return (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            msg.indexOf('@vite/client') !== -1 ||
            file.indexOf('@vite/client') !== -1 ||
            stack.indexOf('@vite/client') !== -1
          );
        };
        window.addEventListener('error', function(e) {
          if (isViteWsError(e)) {
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            e.preventDefault && e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (isViteWsError(e)) {
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            e.preventDefault && e.preventDefault();
            return true;
          }
        }, true);
        var origConsoleError = console.error;
        console.error = function() {
          var argsStr = Array.prototype.join.call(arguments, ' ');
          if (
            argsStr.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            (argsStr.indexOf('[vite]') !== -1 && argsStr.indexOf('WebSocket') !== -1)
          ) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };
      })();
    </script>
