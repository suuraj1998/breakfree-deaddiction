<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="45%" stop-color="#064e3b" />
      <stop offset="85%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.85)" />
      <stop offset="100%" stop-color="rgba(2, 6, 23, 0.95)" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base (Solid opaque, no alpha for Google Play requirements) -->
  <rect width="1024" height="500" fill="#020617" />
  <rect width="1024" height="500" fill="url(#bgGrad)" />

  <!-- Subtle Cyber Radar Background Circles -->
  <g stroke="#10b981" stroke-opacity="0.12" fill="none" stroke-width="1.5">
    <circle cx="820" cy="250" r="90" stroke-dasharray="6 8" />
    <circle cx="820" cy="250" r="170" />
    <circle cx="820" cy="250" r="260" stroke-dasharray="10 14" />
    <circle cx="820" cy="250" r="360" />
    <line x1="820" y1="0" x2="820" y2="500" stroke-opacity="0.08" />
    <line x1="460" y1="250" x2="1024" y2="250" stroke-opacity="0.08" />
  </g>

  <!-- Left Side: Brand Identity & Shield -->
  <!-- Glowing Shield Halo -->
  <circle cx="140" cy="235" r="95" fill="#10b981" opacity="0.18" filter="url(#neonGlow)" />

  <!-- Outer Shield -->
  <path d="M 140 145 L 205 180 L 205 255 C 205 315 140 345 140 345 C 140 345 75 315 75 255 L 75 180 Z"
        fill="url(#shieldGrad)"
        stroke="#6ee7b7"
        stroke-width="4"
        filter="url(#neonGlow)" />

  <!-- Inner Dark Shield Cavity -->
  <path d="M 140 162 L 190 190 L 190 250 C 190 295 140 322 140 322 C 140 322 90 295 90 250 L 90 190 Z"
        fill="#020617"
        opacity="0.85" />

  <!-- Shield Lightning Bolt / Checkmark -->
  <path d="M 115 240 L 132 262 L 168 212"
        fill="none"
        stroke="#34d399"
        stroke-width="9"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Typography Area -->
  <!-- Main Title: BreakFree -->
  <text x="240" y="195" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="-1">
    BreakFree
  </text>

  <!-- Tagline / Subtitle -->
  <text x="244" y="238" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#34d399" letter-spacing="2">
    DE-ADDICTION &amp; SOBRIETY SHIELD
  </text>

  <!-- Features Line with Icons -->
  <text x="244" y="282" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="16" fill="#94a3b8">
    🛡️ Acoustic Siren   •   📍 GPS Radar   •   🧠 AI Urge Drills
  </text>

  <!-- Trust Badges -->
  <!-- Badge 1: 100% Private -->
  <rect x="244" y="318" width="220" height="38" rx="10" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1.2" />
  <text x="260" y="342" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#6ee7b7">
    ★ 100% PRIVATE &amp; LOCAL
  </text>

  <!-- Badge 2: Android 15 & SDK 35 -->
  <rect x="476" y="318" width="180" height="38" rx="10" fill="rgba(6, 182, 212, 0.12)" stroke="#06b6d4" stroke-width="1.2" />
  <text x="492" y="342" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#67e8f9">
    ✓ TARGET SDK 35
  </text>

  <!-- Right Side: Sleek In-App Dashboard Mockup Card -->
  <g transform="translate(685, 95)" filter="url(#cardShadow)">
    <!-- Card Frame -->
    <rect width="285" height="310" rx="20" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />
    
    <!-- Card Top Header -->
    <circle cx="28" cy="30" r="5" fill="#ef4444" />
    <circle cx="44" cy="30" r="5" fill="#f59e0b" />
    <circle cx="60" cy="30" r="5" fill="#10b981" />
    <text x="142" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">
      SOBRIETY RADAR
    </text>

    <!-- Streak Display -->
    <text x="142" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">
      ACTIVE STREAK
    </text>
    <text x="142" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#34d399">
      45 DAYS
    </text>

    <!-- Progress Arc representation -->
    <circle cx="142" cy="125" r="70" fill="none" stroke="#1e293b" stroke-width="6" />
    <circle cx="142" cy="125" r="70" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="330 110" stroke-linecap="round" />

    <!-- Metric Pills inside card -->
    <rect x="22" y="195" width="115" height="50" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="80" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">SAVED</text>
    <text x="80" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#34d399">$675</text>

    <rect x="147" y="195" width="115" height="50" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="205" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">RECLAIMED</text>
    <text x="205" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#38bdf8">108 hrs</text>

    <!-- Shield status badge -->
    <rect x="22" y="258" width="240" height="32" rx="8" fill="rgba(16, 185, 129, 0.15)" />
    <text x="142" y="279" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">
      🛡️ Acoustic Sentinel: ARMED
    </text>
  </g>
</svg>
