<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="35%" stop-color="#064e3b" />
      <stop offset="70%" stop-color="#020617" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="phoneCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <filter id="phoneShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas (Opaque, no alpha for Google Play) -->
  <rect width="1080" height="1920" fill="#020617" />
  <rect width="1080" height="1920" fill="url(#bgGrad)" />

  <!-- Top Marketing Promo Copy -->
  <g text-anchor="middle">
    <!-- Tagline Badge -->
    <rect x="360" y="70" width="360" height="48" rx="24" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.5" />
    <text x="540" y="102" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#6ee7b7" letter-spacing="2">
      ★ RECOVERY &amp; SOBRIETY SHIELD
    </text>

    <!-- Punchy Main Marketing Headline -->
    <text x="540" y="195" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="62" fill="#ffffff">
      Crush Addictive Urges
    </text>
    <text x="540" y="265" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#34d399">
      Track Streaks &amp; Reclaim Focus
    </text>
  </g>

  <!-- Phone Frame Container -->
  <g transform="translate(90, 330)" filter="url(#phoneShadow)">
    <!-- Outer Phone Bezel -->
    <rect width="900" height="1520" rx="60" fill="#090d16" stroke="#1e293b" stroke-width="8" />
    <rect x="8" y="8" width="884" height="1504" rx="52" fill="#020617" />

    <!-- Dynamic Island / Speaker Notch -->
    <rect x="350" y="24" width="200" height="32" rx="16" fill="#000000" />
    <circle cx="510" cy="40" r="6" fill="#1e293b" />

    <!-- Status Bar -->
    <text x="50" y="46" font-family="system-ui, sans-serif" font-weight="700" font-size="18" fill="#ffffff">9:41</text>
    <g transform="translate(800, 32)" fill="#ffffff">
      <path d="M0 14 h4 v-4 h-4 z M6 14 h4 v-8 h-4 z M12 14 h4 v-12 h-4 z M18 14 h4 v-16 h-4 z" />
      <rect x="32" y="1" width="22" height="12" rx="3" fill="none" stroke="#ffffff" stroke-width="2" />
      <rect x="34" y="3" width="14" height="8" rx="1.5" fill="#10b981" />
    </g>

    <!-- App In-Screen Navigation Bar -->
    <g transform="translate(40, 80)">
      <rect width="820" height="70" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <!-- Logo Shield -->
      <path d="M 30 18 L 48 26 L 48 44 C 48 56 30 62 30 62 C 30 62 12 56 12 44 L 12 26 Z" fill="url(#shieldGrad)" />
      <path d="M 24 35 L 28 39 L 36 28" fill="none" stroke="#020617" stroke-width="3" stroke-linecap="round" />
      <text x="60" y="44" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#ffffff">BreakFree</text>
      
      <!-- Pro Badge -->
      <rect x="180" y="22" width="70" height="26" rx="8" fill="rgba(16, 185, 129, 0.2)" />
      <text x="215" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#34d399">ACTIVE</text>
      
      <!-- Panic Trigger Button -->
      <rect x="650" y="14" width="150" height="42" rx="12" fill="#ef4444" />
      <text x="725" y="41" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff">🚨 SOS PANIC</text>
    </g>

    <!-- Main Streak Hero Circle Card -->
    <g transform="translate(40, 175)">
      <rect width="820" height="340" rx="26" fill="url(#phoneCardGrad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
      
      <!-- Circular Progress Ring -->
      <circle cx="210" cy="170" r="105" fill="none" stroke="#1e293b" stroke-width="18" />
      <circle cx="210" cy="170" r="105" fill="none" stroke="#10b981" stroke-width="18" stroke-dasharray="520 180" stroke-linecap="round" filter="url(#glow)" />
      
      <text x="210" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#94a3b8" letter-spacing="1">CLEAN STREAK</text>
      <text x="210" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="44" fill="#34d399">45</text>
      <text x="210" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#ffffff">DAYS</text>

      <!-- Streak Metrics (Right) -->
      <g transform="translate(420, 45)">
        <text x="0" y="30" font-family="system-ui, sans-serif" font-weight="800" font-size="24" fill="#ffffff">Total Life Reclaimed</text>
        <text x="0" y="55" font-family="system-ui, sans-serif" font-weight="500" font-size="14" fill="#94a3b8">Consistent neuroplastic recovery</text>

        <!-- Metric 1: Money Saved -->
        <rect x="0" y="75" width="370" height="75" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        <text x="20" y="110" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#64748b">FINANCES SAVED</text>
        <text x="20" y="136" font-family="system-ui, sans-serif" font-weight="900" font-size="24" fill="#34d399">$675.00</text>
        <text x="350" y="122" text-anchor="end" font-family="system-ui, sans-serif" font-size="20">💰</text>

        <!-- Metric 2: Hours Saved -->
        <rect x="0" y="165" width="370" height="75" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        <text x="20" y="200" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#64748b">HOURS LIBERATED</text>
        <text x="20" y="226" font-family="system-ui, sans-serif" font-weight="900" font-size="24" fill="#38bdf8">108 Hours</text>
        <text x="350" y="212" text-anchor="end" font-family="system-ui, sans-serif" font-size="20">⏳</text>
      </g>
    </g>

    <!-- Habit Cards List -->
    <g transform="translate(40, 545)">
      <text x="10" y="30" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#ffffff">Active Sobriety Shields</text>

      <!-- Habit Item 1: Alcohol -->
      <g transform="translate(0, 50)">
        <rect width="820" height="110" rx="20" fill="#0f172a" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />
        <rect x="20" y="20" width="70" height="70" rx="16" fill="rgba(16, 185, 129, 0.15)" />
        <text x="55" y="65" text-anchor="middle" font-size="32">🍺</text>
        
        <text x="110" y="52" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#ffffff">Alcohol Recovery</text>
        <text x="110" y="80" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#10b981">45 Days Clean • Streak Target: 90 Days</text>
        
        <rect x="670" y="32" width="130" height="46" rx="12" fill="#10b981" />
        <text x="735" y="61" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#020617">PROTECTED</text>
      </g>

      <!-- Habit Item 2: Nicotine / Smoking -->
      <g transform="translate(0, 180)">
        <rect width="820" height="110" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        <rect x="20" y="20" width="70" height="70" rx="16" fill="rgba(56, 189, 248, 0.15)" />
        <text x="55" y="65" text-anchor="middle" font-size="32">🚭</text>
        
        <text x="110" y="52" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#ffffff">Nicotine &amp; Smoke Cessation</text>
        <text x="110" y="80" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#38bdf8">32 Days Smoke-Free • Saved $240</text>
        
        <rect x="670" y="32" width="130" height="46" rx="12" fill="#38bdf8" />
        <text x="735" y="61" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#020617">PROTECTED</text>
      </g>

      <!-- Habit Item 3: Adult Sites & Dopamine Detox -->
      <g transform="translate(0, 310)">
        <rect width="820" height="110" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        <rect x="20" y="20" width="70" height="70" rx="16" fill="rgba(244, 63, 94, 0.15)" />
        <text x="55" y="65" text-anchor="middle" font-size="32">🔞</text>
        
        <text x="110" y="52" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#ffffff">Adult Content Web Blocker</text>
        <text x="110" y="80" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#f43f5e">60 Days Milestone Reached</text>
        
        <rect x="670" y="32" width="130" height="46" rx="12" fill="#f43f5e" />
        <text x="735" y="61" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#ffffff">LOCKED</text>
      </g>

      <!-- Habit Item 4: Sugar Detox -->
      <g transform="translate(0, 440)">
        <rect width="820" height="110" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        <rect x="20" y="20" width="70" height="70" rx="16" fill="rgba(234, 179, 8, 0.15)" />
        <text x="55" y="65" text-anchor="middle" font-size="32">⚡</text>
        
        <text x="110" y="52" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#ffffff">Refined Sugar &amp; Energy Drinks</text>
        <text x="110" y="80" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#eab308">14 Days Clean • Brain Clarity High</text>
        
        <rect x="670" y="32" width="130" height="46" rx="12" fill="#eab308" />
        <text x="735" y="61" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#020617">PROTECTED</text>
      </g>
    </g>

    <!-- Bottom App Navigation Bar -->
    <g transform="translate(40, 1370)">
      <rect width="820" height="90" rx="26" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      
      <!-- Nav Tabs -->
      <g transform="translate(80, 50)" text-anchor="middle">
        <text y="-8" font-size="24">📊</text>
        <text y="20" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#10b981">Dashboard</text>
      </g>

      <g transform="translate(245, 50)" text-anchor="middle">
        <text y="-8" font-size="24">🛡️</text>
        <text y="20" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#64748b">Sentinel</text>
      </g>

      <g transform="translate(410, 50)" text-anchor="middle">
        <text y="-8" font-size="24">📍</text>
        <text y="20" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#64748b">GPS Radar</text>
      </g>

      <g transform="translate(575, 50)" text-anchor="middle">
        <text y="-8" font-size="24">🧠</text>
        <text y="20" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#64748b">SOS Drills</text>
      </g>

      <g transform="translate(740, 50)" text-anchor="middle">
        <text y="-8" font-size="24">🌿</text>
        <text y="20" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#64748b">Wellness</text>
      </g>
    </g>
  </g>
</svg>
