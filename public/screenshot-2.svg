<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="35%" stop-color="#042f2e" />
      <stop offset="70%" stop-color="#020617" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="shieldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.25)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
    </linearGradient>

    <filter id="phoneShadow2" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base (No alpha for Google Play requirements) -->
  <rect width="1080" height="1920" fill="#020617" />
  <rect width="1080" height="1920" fill="url(#bgGrad2)" />

  <!-- Top Marketing Promo Copy -->
  <g text-anchor="middle">
    <!-- Tagline Badge -->
    <rect x="340" y="70" width="400" height="48" rx="24" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4" stroke-width="1.5" />
    <text x="540" y="102" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#67e8f9" letter-spacing="2">
      📍 SMART GEOFENCE &amp; SIREN
    </text>

    <!-- Main Headline -->
    <text x="540" y="195" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="62" fill="#ffffff">
      Acoustic Siren Sentinel
    </text>
    <text x="540" y="265" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#38bdf8">
      GPS Danger Zone Radar
    </text>
  </g>

  <!-- Phone Frame Container -->
  <g transform="translate(90, 330)" filter="url(#phoneShadow2)">
    <!-- Outer Phone Bezel -->
    <rect width="900" height="1520" rx="60" fill="#090d16" stroke="#1e293b" stroke-width="8" />
    <rect x="8" y="8" width="884" height="1504" rx="52" fill="#020617" />

    <!-- Dynamic Island / Speaker Notch -->
    <rect x="350" y="24" width="200" height="32" rx="16" fill="#000000" />
    <circle cx="510" cy="40" r="6" fill="#1e293b" />

    <!-- Status Bar -->
    <text x="50" y="46" font-family="system-ui, sans-serif" font-weight="700" font-size="18" fill="#ffffff">9:41</text>
    <g transform="translate(800, 32)" fill="#ffffff">
      <path d="M0 14 h4 v-4 h-4 z M6 14 h4 v-8 h-4 z M12 14 h4 v-12 h-4 z M18 14 h4 v-16 h-4 z" />
      <rect x="32" y="1" width="22" height="12" rx="3" fill="none" stroke="#ffffff" stroke-width="2" />
      <rect x="34" y="3" width="14" height="8" rx="1.5" fill="#38bdf8" />
    </g>

    <!-- App Header -->
    <g transform="translate(40, 80)">
      <rect width="820" height="70" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <path d="M 30 18 L 48 26 L 48 44 C 48 56 30 62 30 62 C 30 62 12 56 12 44 L 12 26 Z" fill="url(#shieldGrad2)" />
      <path d="M 24 35 L 28 39 L 36 28" fill="none" stroke="#020617" stroke-width="3" stroke-linecap="round" />
      <text x="60" y="44" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#ffffff">Sentinel Radar</text>
      
      <!-- Guardian status -->
      <rect x="220" y="22" width="135" height="26" rx="8" fill="rgba(56, 189, 248, 0.2)" />
      <text x="287" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#38bdf8">GUARDIAN LINKED</text>
      
      <!-- Siren armed badge -->
      <rect x="635" y="14" width="165" height="42" rx="12" fill="#10b981" />
      <text x="717" y="41" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#020617">🛡️ SIREN ARMED</text>
    </g>

    <!-- Interactive Geofence Radar Card -->
    <g transform="translate(40, 175)">
      <rect width="820" height="470" rx="26" fill="#0b1329" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="1.5" />
      
      <!-- Radar Map Background -->
      <g transform="translate(410, 220)">
        <!-- Concentric Radar Rings -->
        <circle cx="0" cy="0" r="60" fill="none" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="2" />
        <circle cx="0" cy="0" r="120" fill="none" stroke="#0ea5e9" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="8 8" />
        <circle cx="0" cy="0" r="180" fill="none" stroke="#0ea5e9" stroke-opacity="0.2" stroke-width="2" />
        
        <!-- Radar Crosshair Axes -->
        <line x1="-200" y1="0" x2="200" y2="0" stroke="#0ea5e9" stroke-opacity="0.2" stroke-width="1.5" />
        <line x1="0" y1="-200" x2="0" y2="200" stroke="#0ea5e9" stroke-opacity="0.2" stroke-width="1.5" />

        <!-- User Location Center Pulse -->
        <circle cx="0" cy="0" r="14" fill="#38bdf8" filter="url(#glow2)" />
        <circle cx="0" cy="0" r="28" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
        <circle cx="0" cy="0" r="6" fill="#ffffff" />

        <!-- Blip 1: Liquor Superstore (Danger Zone - Intercepted) -->
        <g transform="translate(-110, -70)">
          <circle cx="0" cy="0" r="12" fill="#ef4444" filter="url(#glow2)" />
          <circle cx="0" cy="0" r="24" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4" />
          <rect x="-80" y="-45" width="160" height="28" rx="8" fill="rgba(239, 68, 68, 0.9)" />
          <text x="0" y="-27" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#ffffff">LIQUOR SHOP (120m)</text>
        </g>

        <!-- Blip 2: Smoke Haven (Danger Zone - Alert set) -->
        <g transform="translate(130, 80)">
          <circle cx="0" cy="0" r="12" fill="#f59e0b" filter="url(#glow2)" />
          <rect x="-85" y="-45" width="170" height="28" rx="8" fill="rgba(245, 158, 11, 0.9)" />
          <text x="0" y="-27" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#ffffff">VAPE LOUNGE (340m)</text>
        </g>
      </g>

      <!-- Radar Top Overlay Tag -->
      <g transform="translate(30, 30)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#ffffff">GPS Proximity Scanner</text>
        <text x="0" y="24" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#38bdf8">LIVE RADAR • 100m Intervention Radius</text>
      </g>
    </g>

    <!-- Acoustic Sentinel & Anti-Tamper Policy Cards -->
    <g transform="translate(40, 675)">
      <text x="10" y="30" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#ffffff">Acoustic &amp; Anti-Bypass Protocols</text>

      <!-- Protocol 1: Acoustic Siren Alarm -->
      <g transform="translate(0, 50)">
        <rect width="820" height="135" rx="22" fill="#0f172a" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />
        <rect x="25" y="25" width="85" height="85" rx="18" fill="rgba(16, 185, 129, 0.15)" />
        <text x="67" y="78" text-anchor="middle" font-size="40">🚨</text>

        <text x="135" y="58" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#ffffff">105 dB High-Decibel Siren</text>
        <text x="135" y="86" font-family="system-ui, sans-serif" font-weight="500" font-size="14" fill="#94a3b8">Forces physiological grounding during acute craving spikes</text>
        
        <!-- Status indicator -->
        <rect x="670" y="44" width="125" height="46" rx="12" fill="#10b981" />
        <text x="732" y="73" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#020617">ACTIVE</text>
      </g>

      <!-- Protocol 2: Guardian PIN Verification -->
      <g transform="translate(0, 205)">
        <rect width="820" height="135" rx="22" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        <rect x="25" y="25" width="85" height="85" rx="18" fill="rgba(56, 189, 248, 0.15)" />
        <text x="67" y="78" text-anchor="middle" font-size="40">🔒</text>

        <text x="135" y="58" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#ffffff">Master Guardian Unlock PIN</text>
        <text x="135" y="86" font-family="system-ui, sans-serif" font-weight="500" font-size="14" fill="#94a3b8">Emergency alarm cannot be silenced without guardian intervention</text>

        <rect x="670" y="44" width="125" height="46" rx="12" fill="#0284c7" />
        <text x="732" y="73" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#ffffff">LOCKED</text>
      </g>

      <!-- Protocol 3: Incognito & VPN Lockdown -->
      <g transform="translate(0, 360)">
        <rect width="820" height="135" rx="22" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        <rect x="25" y="25" width="85" height="85" rx="18" fill="rgba(168, 85, 247, 0.15)" />
        <text x="67" y="78" text-anchor="middle" font-size="40">🛡️</text>

        <text x="135" y="58" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#ffffff">Anti-Bypass Shield Engine</text>
        <text x="135" y="86" font-family="system-ui, sans-serif" font-weight="500" font-size="14" fill="#94a3b8">Monitors incognito evasion, proxy tampering, and app deletion attempts</text>

        <rect x="670" y="44" width="125" height="46" rx="12" fill="#7c3aed" />
        <text x="732" y="73" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#ffffff">SECURE</text>
      </g>
    </g>

    <!-- Bottom App Navigation Bar -->
    <g transform="translate(40, 1370)">
      <rect width="820" height="90" rx="26" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      
      <g transform="translate(80, 50)" text-anchor="middle">
        <text y="-8" font-size="24">📊</text>
        <text y="20" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#64748b">Dashboard</text>
      </g>

      <g transform="translate(245, 50)" text-anchor="middle">
        <text y="-8" font-size="24">🛡️</text>
        <text y="20" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#38bdf8">Sentinel</text>
      </g>

      <g transform="translate(410, 50)" text-anchor="middle">
        <text y="-8" font-size="24">📍</text>
        <text y="20" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#64748b">GPS Radar</text>
      </g>

      <g transform="translate(575, 50)" text-anchor="middle">
        <text y="-8" font-size="24">🧠</text>
        <text y="20" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#64748b">SOS Drills</text>
      </g>

      <g transform="translate(740, 50)" text-anchor="middle">
        <text y="-8" font-size="24">🌿</text>
        <text y="20" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#64748b">Wellness</text>
      </g>
    </g>
  </g>
</svg>
